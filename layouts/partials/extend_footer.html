{{- if .IsPage }}
<script>
(function () {
    // ---------- 阅读进度条 ----------
    if (document.querySelector('.post-single')) {
        var bar = document.createElement('div');
        bar.id = 'reading-progress';
        document.body.appendChild(bar);

        var ticking = false;
        function update() {
            var el = document.documentElement;
            var top = el.scrollTop || document.body.scrollTop;
            var height = el.scrollHeight - el.clientHeight;
            var pct = height > 0 ? (top / height) * 100 : 0;
            bar.style.width = pct.toFixed(2) + '%';
            ticking = false;
        }
        window.addEventListener('scroll', function () {
            if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
        }, { passive: true });
        window.addEventListener('resize', update);
        update();
    }

    // ---------- 图片灯箱 ----------
    var content = document.querySelector('.post-content');
    if (!content) return;

    var imgs = content.querySelectorAll('img');
    if (!imgs.length) return;

    var overlay = document.createElement('div');
    overlay.className = 'lightbox-overlay';
    overlay.innerHTML = '<button class="lightbox-close" aria-label="关闭">&times;</button><img alt="">';
    document.body.appendChild(overlay);

    var big = overlay.querySelector('img');

    function open(src, alt) {
        big.src = src;
        big.alt = alt || '';
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function close() {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    imgs.forEach(function (img) {
        img.addEventListener('click', function (e) {
            e.preventDefault();
            open(img.currentSrc || img.src, img.alt);
        });
    });

    overlay.addEventListener('click', function (e) {
        if (e.target !== big) close();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
    });
})();
</script>
{{- end }}
